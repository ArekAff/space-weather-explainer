[project]
name = "swx-ingest"
version = "0.1.0"
description = "Data ingestion for the space-weather platform: collectors, raw archive, normalised tables"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.scripts]
swx-noaa-live = "swx_ingest.sources.noaa_swpc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swx_ingest"]
